# This example runs in a Runner job container (VM 1 in the suggested architecture).
# This image's JDK 25 serves the build, independently of the SonarQube JDK on VM 2.
# Publishing targets GitLab through ci_settings.xml; Nexus on VM 3 is not configured here.
# Maven build/test and publishing to the repository configured in ci_settings.xml.
# Requires a project compatible with JDK 25 and a pom.xml.
# https://docs.gitlab.com/user/packages/maven_repository/
image: maven:3.9.16-eclipse-temurin-25

variables:
  # Maven JVM options; the local repository is a cache in the CI workspace,
  # unrelated to the Nexus server's data directory.
  MAVEN_OPTS: >-
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true
  # Maven options shared by jobs: non-interactive mode and publishing at the end of the build.
  MAVEN_CLI_OPTS: >-
    --batch-mode
    --errors
    --fail-at-end
    --show-version
    --no-transfer-progress
    -DinstallAtEnd=true
    -DdeployAtEnd=true

cache:
  paths:
    - .m2/repository

# Validate merge requests and non-default branches without publishing.
verify:jdk25:
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# Publish only from the default branch; configure distributionManagement in the POM
# with the gitlab-maven ID and copy ci_settings.xml to the application project root.
deploy:jdk25:
  stage: deploy
  script:
    - test -f ci_settings.xml
    - mvn $MAVEN_CLI_OPTS deploy --settings ci_settings.xml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
