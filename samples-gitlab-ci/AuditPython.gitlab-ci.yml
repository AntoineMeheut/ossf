# Example for a Python project run by the Runner (VM 1) inside its job container.
# These paths and Python environments belong to the job; they do not configure any VM.
# This pipeline does not require any OSSF installation passwords.
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/development/cicd/templates/
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Python.gitlab-ci.yml

# Official language image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/python/tags/
image: python:3.14.7

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  # Cache inside the GitLab workspace, preserved by the cache block below.
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# https://pip.pypa.io/en/stable/topics/caching/
cache:
  paths:
    - .cache/pip

# Create an isolated Python environment for each job; the pip cache avoids repeated downloads.
before_script:
  - python --version ; pip --version  # For debugging
  - python -m venv venv
  - source venv/bin/activate

# The project must define [test] dependencies and the py and ruff tox environments.
test:
  script:
    - pip install ruff tox  # you can also use tox
    - pip install --editable ".[test]"
    - tox -e py,ruff

# Extend this example: it only installs the package without running an application command.
run:
  script:
    - pip install .
    # run the command here
  artifacts:
    paths:
      - build/*

# Build Sphinx documentation from doc/ and publish public/ through GitLab Pages.
# This publication does not deploy the applications on VMs 2 and 3.
pages:
  stage: deploy
  pages:
    publish: public
  script:
    - pip install sphinx sphinx-rtd-theme
    - cd doc
    - make html
    - mv build/html/ ../public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Replace with the project's deployment steps; echo does not deploy anything to production.
deploy:
  stage: deploy
  script: echo "Define your deployment script!"
  environment: production
