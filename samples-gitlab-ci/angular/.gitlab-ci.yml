# OSSF integration guide: docs/CI.md; assemble with security/prepare-example.py.
# Assemble with security/prepare-example.py angular DEST (no application source is copied).
# GitLab CE: npm audit + OWASP Dependency-Check replace Ultimate-only DS.
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

stages: [prepare, test, build, scan, quality, publish]
workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

default:
  image: node:22.23.2-bookworm-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9
  tags: [ossf-security]
  interruptible: true
  timeout: 30m

variables:
  OSSF_PROFILE: angular
  CI: "true"
  ANGULAR_DIST_DIR: "dist/app/browser"
  ANGULAR_SMOKE_PATH: "/"
  CHROME_BIN: /usr/bin/chromium
  GIT_DEPTH: "0"
  DD_MIN_SEVERITY: High
  NG_CLI_ANALYTICS: "false"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  SONAR_USER_HOME: "$CI_PROJECT_DIR/.cache/sonar"
  NVD_DATAFEED: "https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz"
  SAST_EXCLUDED_ANALYZERS: "gitlab-advanced-sast,gitlab-advanced-sast-cpp,gitlab-advanced-sast-ext"

.api_job:
  image: python:3.14.7-slim-trixie
  before_script:
    - pip install requests==2.34.2

resolve_dependencies:
  stage: prepare
  script:
    - npm ci --no-audit --no-fund
  cache:
    key: "npm-angular-$CI_RUNNER_EXECUTABLE_ARCH"
    paths: [.npm/]
  artifacts:
    access: developer
    expire_in: 1 day
    paths: [node_modules/]

angular_tests:
  stage: test
  needs: [resolve_dependencies]
  script:
    - apt-get update && apt-get install -y --no-install-recommends chromium
    - npm run test:ci
    - npm run build:ci
    - test -f "$ANGULAR_DIST_DIR/index.html"
    - mkdir -p .ci-dist
    - cp -R "$ANGULAR_DIST_DIR"/. .ci-dist/
  artifacts:
    access: developer
    expire_in: 1 day
    paths: [.ci-dist/, coverage/]

# All three GitLab analyzers are actual official images/templates. AMD64 is
# mandatory; on the ARM lab runner this requires binfmt/QEMU (see README).
secret_detection:
  dependencies: []
  allow_failure: false
  image:
    name: "$SECURE_ANALYZERS_PREFIX/secrets:7"
    docker:
      platform: linux/amd64
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "true"
  artifacts:
    when: always
    paths: [gl-secret-detection-report.json]

semgrep-sast:
  dependencies: []
  allow_failure: false
  image:
    name: "$SECURE_ANALYZERS_PREFIX/semgrep:6"
    docker:
      platform: linux/amd64
  artifacts:
    when: always
    paths: [gl-sast-report.json]

npm_audit:
  stage: test
  needs: [resolve_dependencies]
  dependencies: []
  script:
    - mkdir -p reports
    - |
      status=0
      npm audit --package-lock-only --json > reports/npm-audit.json || status=$?
      node ci/check-npm-audit.cjs "$status"
  artifacts:
    when: always
    access: developer
    paths: [reports/npm-audit.json]

owasp_dependency_check:
  stage: test
  needs: [resolve_dependencies]
  image:
    # Official multi-architecture image, resolved on 2026-11-01.
    name: "owasp/dependency-check@sha256:0e8f69ad5b00d62000937f4e57189812343f6903d9c83ee712012d51542a020a"
    entrypoint: [""]
  timeout: 1h
  resource_group: dependency-check-cache
  variables:
    JAVA_OPTS: "-Xmx2g"
  cache:
    key: dependency-check-2026-11
    paths: [.cache/dependency-check/]
  script:
    - mkdir -p reports .cache/dependency-check .odc-input
    - cp package.json package-lock.json .odc-input/
    - ln -s "$CI_PROJECT_DIR/node_modules" .odc-input/node_modules
    - >-
      /usr/share/dependency-check/bin/dependency-check.sh
      --project "$CI_PROJECT_PATH" --scan .odc-input/package-lock.json
      --data .cache/dependency-check --nvdDatafeed "$NVD_DATAFEED"
      --disableOssIndex --format JSON --format XML --format HTML --out reports
  artifacts:
    when: always
    access: developer
    paths: [reports/dependency-check-report.json, reports/dependency-check-report.xml, reports/dependency-check-report.html]

npm_sbom:
  stage: test
  needs: [resolve_dependencies]
  script:
    - mkdir -p reports
    - npm install --prefix /tmp/sbom-tools --ignore-scripts --no-audit --no-fund @cyclonedx/cyclonedx-npm@6.0.1
    - /tmp/sbom-tools/node_modules/.bin/cyclonedx-npm --spec-version 1.6 --output-format JSON --output-reproducible --output-file reports/application-sbom.cdx.json
  artifacts:
    access: developer
    paths: [reports/application-sbom.cdx.json]
    reports:
      cyclonedx: reports/application-sbom.cdx.json

sonarqube:
  stage: test
  needs: [angular_tests]
  resource_group: sonarqube-analysis
  image:
    name: "sonarsource/sonar-scanner-cli@sha256:47956b669bf486bdad919e1cbd0533223515aa0b6d1d31763e5a3754942df6d7"
    entrypoint: [""]
    docker:
      platform: linux/amd64
  script:
    - mkdir -p reports
    - sonar-scanner -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.scm.revision="$CI_COMMIT_SHA" -Dsonar.scanner.metadataFilePath="$CI_PROJECT_DIR/reports/sonar-task.txt"
    - python3 -m pip install --target .sonar-tools requests==2.34.2
    - PYTHONPATH="$CI_PROJECT_DIR/.sonar-tools" python3 ci/pipeline.py sonar-export
  artifacts:
    when: always
    access: developer
    paths: [reports/sonar-task.txt, reports/sonarqube.json, reports/sonar-quality-gate.json]

build_container:
  stage: build
  needs: [angular_tests]
  image: docker:29.8.1-cli
  services:
    - name: docker:29.8.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  script:
    - export APP_IMAGE="$CI_PROJECT_PATH_SLUG:$CI_COMMIT_SHA"
    - docker build --pull --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" -t "$APP_IMAGE" .
    - docker run -d --name smoke "$APP_IMAGE"
    - trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT
    - |
      ready=false
      for attempt in $(seq 1 30); do
        if docker exec smoke wget -q -O /tmp/index.html "http://127.0.0.1:8080$ANGULAR_SMOKE_PATH"; then
          docker cp smoke:/tmp/index.html /tmp/image-index.html
          cmp .ci-dist/index.html /tmp/image-index.html
          ready=true
          break
        fi
        sleep 2
      done
      test "$ready" = true
    - mkdir -p dist
    - docker save --output dist/image.tar "$APP_IMAGE"
    - chmod 644 dist/image.tar
  artifacts:
    access: developer
    expire_in: 1 day
    paths: [dist/image.tar]

container_scanning:
  stage: scan
  allow_failure: false
  needs: [build_container]
  # Overrides the template's empty dependencies list to download the archive.
  dependencies: [build_container]
  image:
    name: "$CS_ANALYZER_IMAGE"
    docker:
      platform: linux/amd64
  variables:
    CS_IMAGE: archive://dist/image.tar
    CS_INCLUDE_LICENSES: "true"
  artifacts:
    when: always
    paths: [gl-container-scanning-report.json, gl-sbom-report.cdx.json]

defectdojo_quality_barrier:
  extends: .api_job
  stage: quality
  needs: [secret_detection, semgrep-sast, npm_audit, owasp_dependency_check, npm_sbom, sonarqube, build_container, container_scanning]
  script:
    - python ci/pipeline.py gate
  artifacts:
    when: always
    access: developer
    paths: [reports/gate-summary.json, reports/approval.json]

publish_nexus:
  extends: .api_job
  stage: publish
  interruptible: false
  needs: [defectdojo_quality_barrier, build_container, npm_sbom, container_scanning]
  script:
    - python ci/pipeline.py publish
