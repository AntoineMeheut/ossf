# Assemble this overlay with security/prepare-example.py (shared ci/pipeline.py is required).
# Surfnews/Drupal CE profile: Composer audit + OWASP Dependency-Check replace Ultimate-only DS.
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

stages: [prepare, test, build, scan, quality, publish]

# Tokens and a privileged Docker runner are reserved for trusted protected refs.
# Community Build analyzes one branch: use a separate SONAR_PROJECT_KEY per app/ref.
workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

default:
  image: php:8.5.10-cli-trixie
  tags: [ossf-security]
  interruptible: true
  timeout: 30m

variables:
  OSSF_PROFILE: surfnews
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  GIT_DEPTH: "0"
  DD_MIN_SEVERITY: High
  SONAR_USER_HOME: "$CI_PROJECT_DIR/.cache/sonar"
  NVD_DATAFEED: "https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz"
  # Use the open-source Semgrep analyzer, including PHP support.
  SAST_EXCLUDED_ANALYZERS: "gitlab-advanced-sast,gitlab-advanced-sast-cpp,gitlab-advanced-sast-ext"

.php_job:
  needs: [resolve_dependencies]
  before_script:
    - sh ci/php-setup.sh

.api_job:
  image: python:3.14.7-slim-trixie
  before_script:
    - pip install requests==2.34.2

resolve_dependencies:
  extends: .php_job
  needs: []
  stage: prepare
  script:
    - composer validate --no-check-publish
    - composer install --prefer-dist --no-interaction --no-progress
  cache:
    key: composer-surfnews
    paths: [.cache/composer/]
  artifacts:
    access: developer
    expire_in: 1 day
    paths: [vendor/, web/core/, web/modules/contrib/, web/profiles/contrib/, web/libraries/]

surfnews_tests:
  extends: .php_job
  stage: test
  script:
    - find web/themes/aloha_surf -type f \( -name '*.php' -o -name '*.theme' -o -name '*.inc' \) -print0 | xargs -0 -n1 php -l
    - php ci/test-theme.php

# All three GitLab analyzers are actual official images/templates. AMD64 is
# mandatory; on the ARM lab runner this requires binfmt/QEMU (see README).
secret_detection:
  dependencies: []
  allow_failure: false
  image:
    name: "$SECURE_ANALYZERS_PREFIX/secrets:7"
    docker:
      platform: linux/amd64
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "true"
  artifacts:
    when: always
    paths: [gl-secret-detection-report.json]

semgrep-sast:
  dependencies: []
  allow_failure: false
  # Semgrep's PHP extension matching omits Drupal's .theme/.module/.inc files.
  # Scan byte-identical .php aliases, then restore the original report paths.
  script:
    - python3 ci/drupal-sast.py prepare
    - /analyzer run
    - python3 ci/drupal-sast.py normalize
  image:
    name: "$SECURE_ANALYZERS_PREFIX/semgrep:6"
    docker:
      platform: linux/amd64
  artifacts:
    when: always
    paths: [gl-sast-report.json, reports/sast-aliases.json]

composer_audit:
  extends: .php_job
  stage: test
  script:
    - mkdir -p reports
    - |
      status=0
      composer audit --locked --format=json > reports/composer-audit.json || status=$?
      php ci/check-composer-audit.php "$status"
  artifacts:
    when: always
    access: developer
    paths: [reports/composer-audit.json]

owasp_dependency_check:
  stage: test
  needs: [resolve_dependencies]
  image:
    # Official multi-architecture image, resolved on 2026-11-01.
    name: "owasp/dependency-check@sha256:0e8f69ad5b00d62000937f4e57189812343f6903d9c83ee712012d51542a020a"
    entrypoint: [""]
  timeout: 1h
  resource_group: dependency-check-cache
  variables:
    JAVA_OPTS: "-Xmx2g"
  cache:
    key: dependency-check-2026-11
    paths: [.cache/dependency-check/]
  script:
    - mkdir -p reports .cache/dependency-check
    - >-
      /usr/share/dependency-check/bin/dependency-check.sh
      --project "$CI_PROJECT_PATH" --scan composer.lock --enableExperimental
      --data .cache/dependency-check --nvdDatafeed "$NVD_DATAFEED"
      --disableOssIndex --format JSON --format XML --format HTML --out reports
  artifacts:
    when: always
    access: developer
    paths: [reports/dependency-check-report.json, reports/dependency-check-report.xml, reports/dependency-check-report.html]

composer_sbom:
  extends: .php_job
  stage: test
  script:
    - mkdir -p reports
    - composer global config --no-plugins allow-plugins.cyclonedx/cyclonedx-php-composer true
    - composer global require --no-interaction cyclonedx/cyclonedx-php-composer:6.2.0
    - composer CycloneDX:make-sbom --output-format=JSON --spec-version=1.6 --output-file=reports/application-sbom.cdx.json
  artifacts:
    access: developer
    paths: [reports/application-sbom.cdx.json]
    reports:
      cyclonedx: reports/application-sbom.cdx.json

sonarqube:
  stage: test
  needs: [surfnews_tests]
  resource_group: sonarqube-analysis
  image:
    name: "sonarsource/sonar-scanner-cli@sha256:47956b669bf486bdad919e1cbd0533223515aa0b6d1d31763e5a3754942df6d7"
    entrypoint: [""]
    docker:
      platform: linux/amd64
  script:
    - mkdir -p reports
    - sonar-scanner -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.scm.revision="$CI_COMMIT_SHA" -Dsonar.scanner.metadataFilePath="$CI_PROJECT_DIR/reports/sonar-task.txt"
    - python3 -m pip install --target .sonar-tools requests==2.34.2
    - PYTHONPATH="$CI_PROJECT_DIR/.sonar-tools" python3 ci/pipeline.py sonar-export
  artifacts:
    when: always
    access: developer
    paths: [reports/sonar-task.txt, reports/sonarqube.json, reports/sonar-quality-gate.json]

build_container:
  stage: build
  image: docker:29.8.1-cli
  services:
    - name: docker:29.8.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  script:
    - docker info
    - export APP_IMAGE="$CI_PROJECT_PATH_SLUG:$CI_COMMIT_SHA"
    - docker build --pull --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" -t "$APP_IMAGE" .
    - docker run --rm --entrypoint php "$APP_IMAGE" -r 'require "/app/vendor/autoload.php"; if (!class_exists("Drupal\\Core\\DrupalKernel")) { exit(1); }'
    - mkdir -p dist
    - docker save --output dist/image.tar "$APP_IMAGE"
    - chmod 644 dist/image.tar
  artifacts:
    access: developer
    expire_in: 1 day
    paths: [dist/image.tar]

container_scanning:
  stage: scan
  allow_failure: false
  needs: [build_container]
  # Overrides the template's empty dependencies list to download the archive.
  dependencies: [build_container]
  image:
    name: "$CS_ANALYZER_IMAGE"
    docker:
      platform: linux/amd64
  variables:
    CS_IMAGE: archive://dist/image.tar
    CS_INCLUDE_LICENSES: "true"
  artifacts:
    when: always
    paths: [gl-container-scanning-report.json, gl-sbom-report.cdx.json]

defectdojo_quality_barrier:
  extends: .api_job
  stage: quality
  needs: [secret_detection, semgrep-sast, composer_audit, owasp_dependency_check, composer_sbom, sonarqube, build_container, container_scanning]
  script:
    - python ci/pipeline.py gate
  artifacts:
    when: always
    access: developer
    paths: [reports/gate-summary.json, reports/approval.json]

publish_nexus:
  extends: .api_job
  stage: publish
  interruptible: false
  needs: [defectdojo_quality_barrier, build_container, composer_sbom, container_scanning]
  script:
    - python ci/pipeline.py publish
